<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>MedView — незабаром</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
      --bg: #f7f9fc;
      --heading: #0A1628;
      --wordmark: #0B1B2B;
      --body: #64748b;
      --note: #8593a9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--heading);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { max-width: 620px; text-align: center; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 30px;
    }
    .logo svg { flex: none; width: 48px; height: 48px; }
    .mark-dark { display: none; }
    .wordmark {
      font-family: 'Sora', -apple-system, 'Segoe UI', sans-serif;
      font-size: 33px;
      letter-spacing: -0.5px;
      color: var(--wordmark);
    }
    .wordmark .w-light { font-weight: 300; }
    .wordmark .w-bold { font-weight: 800; }
    h1 {
      font-family: 'Sora', -apple-system, 'Segoe UI', sans-serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: -0.8px;
      margin-bottom: 16px;
    }
    p { font-size: 17px; line-height: 1.65; color: var(--body); }
    .divider {
      width: 64px; height: 4px; border-radius: 2px;
      background: linear-gradient(135deg, #2563EB, #06B6D4);
      margin: 28px auto;
    }
    .note { font-size: 14px; color: var(--note); }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0A1628;
        --heading: #eef3fa;
        --wordmark: #ffffff;
        --body: #9fadc4;
        --note: #67758d;
      }
      .mark-light { display: none; }
      .mark-dark { display: block; }
      .wordmark .w-bold { color: #2DD4BF; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <!-- Pulse Play mark, light bg: Clinical Blue → Signal Cyan gradient -->
      <svg class="mark-light" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <defs><linearGradient id="pp-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
        </linearGradient></defs>
        <path d="M44 34 L96 60 L44 86 Z" fill="none" stroke="url(#pp-g)" stroke-width="7" stroke-linejoin="round"/>
        <path d="M16 60 h20 l7 -14 9 28 8 -14 h14" fill="none" stroke="url(#pp-g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <!-- Dark-bg version per brand guide: white play, Vital Mint pulse -->
      <svg class="mark-dark" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path d="M44 34 L96 60 L44 86 Z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
        <path d="M16 60 h20 l7 -14 9 28 8 -14 h14" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="wordmark"><span class="w-light">Med</span><span class="w-bold">View</span></div>
    </div>
    <h1>Сайт у розробці</h1>
    <p>
      Ми будуємо платформу телемедицини для клінік та пацієнтів.
      Скоро тут з&rsquo;явиться повноцінний сайт.
    </p>
    <div class="divider"></div>
    <p class="note">MedView · платформа онлайн-консультацій</p>
  </main>
</body>
</html>
